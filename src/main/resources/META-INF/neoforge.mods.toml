modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "corpsedragonsurvival.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "corpsedragonsurvival.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "dragonsurvival"
type = "required"
versionRange = "[2.0.53,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "corpse"
type = "required"
versionRange = "[1.21.1-1.1.13,)"
ordering = "AFTER"
side = "BOTH"